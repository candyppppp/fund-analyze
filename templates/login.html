<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - FundTracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        .login-cover {
            flex: 1;
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        .login-cover::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="rgba(255,255,255,0.05)"/><circle cx="20" cy="20" r="15" fill="rgba(255,255,255,0.05)"/><circle cx="80" cy="80" r="10" fill="rgba(255,255,255,0.05)"/></svg>');
            animation: float 20s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0px) rotate(360deg); }
        }
        .login-cover-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }
        .login-cover h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .login-cover p {
            font-size: 18px;
            color: rgba(255,255,255,0.8);
            max-width: 400px;
            line-height: 1.5;
        }
        .login-container {
            width: 400px;
            background-color: #1e1e1e;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: -5px 0 25px rgba(0,0,0,0.3);
        }
        .login-container h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #ffffff;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #b0b0b0;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #2a2a2a;
            color: #ffffff;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }
        .captcha-group {
            display: flex;
            gap: 10px;
        }
        .captcha-group input {
            flex: 1;
        }
        .captcha-image {
            width: 120px;
            height: 44px;
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 2px;
            color: #007bff;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0069d9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,123,255,0.3);
        }
        .error-message {
            color: #ff4444;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
        .default-credentials {
            margin-top: 30px;
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }
        .default-credentials strong {
            color: #007bff;
        }
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .login-cover {
                width: 100%;
                height: 30vh;
                padding: 20px;
            }
            .login-cover h1 {
                font-size: 32px;
            }
            .login-container {
                width: 100%;
                height: 70vh;
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="login-cover">
        <div class="login-cover-content">
            <h1>FundTracker</h1>
            <p>专业的基金分析与投资管理平台，帮助您实现财富增长目标</p>
        </div>
    </div>
    <div class="login-container">
        <h2>登录</h2>
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">登录</button>
        </form>
    </div>

</body>
</html>
