<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FundTracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span class="fund-part">Fund</span><span class="tracker-part">Tracker</span></h1>
            <div class="header-buttons">
                <button>设置</button>
            </div>
        </div>

        <!-- 大盘指数条 -->
        <div id="market-ticker" style="
            background:#0d0d0d;
            border-bottom:1px solid #1a1a1a;
            padding:0 14px;
            display:flex;
            align-items:center;
            height:34px;
            overflow:hidden;
            flex-shrink:0;
        ">
            <!-- 指数列表（滚动区） -->
            <div id="ticker-inner" style="
                display:flex;
                align-items:center;
                gap:20px;
                flex:1;
                overflow-x:auto;
                scrollbar-width:none;
                -ms-overflow-style:none;
                white-space:nowrap;
            ">
                <span style="font-size:11px;color:#333;padding-left:4px;">加载中...</span>
            </div>
            <!-- 右侧：市场状态 + 时间 -->
            <div id="ticker-status" style="
                display:flex;
                flex-direction:column;
                align-items:flex-end;
                flex-shrink:0;
                margin-left:14px;
                gap:1px;
            ">
                <span id="market-status" style="font-size:10px;color:#888;">--</span>
                <span id="market-clock" style="font-size:11px;color:#555;font-variant-numeric:tabular-nums;letter-spacing:.5px;">--:--:--</span>
            </div>
        </div>
        <style>
            #ticker-inner::-webkit-scrollbar { display:none; }
            .ticker-item {
                display:inline-flex;
                align-items:baseline;
                gap:5px;
                flex-shrink:0;
            }
            .ticker-name  { font-size:11px; color:#888; }
            .ticker-price { font-size:12px; font-weight:500; color:#e0e0e0; letter-spacing:.3px; }
            .ticker-chg   { font-size:11px; font-weight:500; }
            .tc-up   { color:#f04040; }
            .tc-down { color:#28a745; }
            .tc-flat { color:#888; }
            .ticker-sep { color:#222; font-size:14px; user-select:none; }
        </style>

        <div class="tabs">
            <button class="tab active">基金自选</button>
            <button class="tab">基金投资</button>
        </div>

        <div class="search-container">
            <form id="add-fund-form">
                <input type="text" id="fund-code" class="search-input" placeholder="输入基金代码" required autocomplete="off">
                <button type="submit" class="add-button">+ Add</button>
            </form>
        </div>

        <div id="fund-list-header" style="display:flex;align-items:center;padding:8px 24px 6px;margin-bottom:2px;">
            <span style="font-size:13px;color:#888;letter-spacing:.5px;">Group Count</span>
            <span id="group-count" class="group-count" style="margin-left:8px;">0</span>
        </div>

        <div class="fund-list">
            <div id="funds-container"></div>
        </div>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
