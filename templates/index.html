<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FundTracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span class="fund-part">Fund</span><span class="tracker-part">Tracker</span></h1>
            <div class="header-buttons">
                <button>设置</button>
            </div>
        </div>

        <!-- 大盘指数条 -->
        <div id="market-ticker" style="
            background:#0d0d0d;
            border-bottom:1px solid #1a1a1a;
            padding:0 8px;
            display:flex;
            align-items:center;
            height:42px;
            flex-shrink:0;
            justify-content:center; /* 添加居中 */
        ">
            <!-- 指数列表（居中显示）  -->
        <div id="ticker-inner" style="
            display:flex;
            align-items:center;
            height:100%;
            gap:16px; /* 可以添加项目间距 */
        ">
            <span style="font-size:12px;color:#444;align-self:center;padding-left:4px;">加载中...</span>
            </div>
        </div>
        <style>
            .ticker-item {
                display:inline-flex;
                align-items:center;
                justify-content: center; /* 内容居中 */
                gap:6px;
                flex-shrink:0;
                padding:0 12px;
                height:100%;
                border-right:1px solid #1a1a1a;
                box-sizing:border-box;
            }
            .ticker-item:last-child { border-right:none; }
            .ticker-name  { font-size:11px; color:#aaa; font-weight:400; }
            .ticker-price { font-size:11px; font-weight:500; color:#e8e8e8; letter-spacing:.3px; font-variant-numeric:tabular-nums; }
            .ticker-chg   { font-size:11px; font-weight:500; font-variant-numeric:tabular-nums; }
            .tc-up   { color:#e84040; }
            .tc-down { color:#28a745; }
            .tc-flat { color:#666; }
        </style>

        <div class="tabs">
            <button class="tab active">基金自选</button>
            <button class="tab">基金投资</button>
        </div>

        <div class="search-container">
            <form id="add-fund-form">
                <input type="text" id="fund-code" class="search-input" placeholder="输入基金代码" required autocomplete="off">
                <button type="submit" class="add-button">+ Add</button>
            </form>
        </div>

        <div id="fund-list-header" style="display:flex;align-items:center;padding:8px 24px 6px;margin-bottom:2px;">
            <span style="font-size:13px;color:#888;letter-spacing:.5px;">Group Count</span>
            <span id="group-count" class="group-count" style="margin-left:8px;">0</span>
        </div>

        <div class="fund-list">
            <div id="funds-container"></div>
        </div>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
