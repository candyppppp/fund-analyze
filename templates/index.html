<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FundTracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span class="fund-part">Fund</span><span class="tracker-part">Tracker</span></h1>
            <div class="header-buttons">
                <button>设置</button>
            </div>
        </div>

        <!-- 大盘指数条 -->
        <div id="market-ticker">
            <!-- ticker-track 是唯一移动的容器，JS 控制 translateX -->
            <div id="ticker-track">
                <div id="ticker-inner">
                    <span class="ticker-loading">加载中...</span>
                </div>
                <!-- 克隆节点紧跟其后，实现无缝循环 -->
                <div id="ticker-inner-clone" aria-hidden="true"></div>
            </div>
        </div>
        <style>
        /* ── Ticker 容器 ── */
        #market-ticker {
            background: #0d0d0d;
            border-bottom: 1px solid #1a1a1a;
            height: 42px;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }
        /* track 是真正移动的层，宽度由内容撑开 */
        #ticker-track {
            display: flex;
            align-items: center;
            height: 100%;
            width: max-content;   /* 撑开到内容宽度 */
            will-change: transform;
        }
        #ticker-inner, #ticker-inner-clone {
            display: flex;
            align-items: center;
            height: 100%;
            flex-shrink: 0;
        }
        .ticker-loading { font-size:12px; color:#444; padding-left:20px; }

        .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            padding: 0 26px;
            height: 100%;
            border-right: 1px solid #1a1a1a;
            box-sizing: border-box;
        }
        /* 桌面端最后一个 item 去掉右边框；手机跑马灯中每个 item 都保留（作为无缝循环的分隔线）*/
        @media (min-width: 601px) {
            .ticker-item:last-child { border-right: none; }
        }
        .ticker-name  { font-size: 11px; color: #aaa; font-weight: 400; }
        .ticker-price { font-size: 12px; font-weight: 500; color: #e8e8e8;
                        letter-spacing: .3px; font-variant-numeric: tabular-nums; }
        .ticker-chg   { font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
        .tc-up   { color: #e84040; }
        .tc-down { color: #28a745; }
        .tc-flat { color: #666; }

        /* 桌面：ticker-track 撑满屏幕宽度，inner 静态排列（内容不足时居左） */
        @media (min-width: 601px) {
            #ticker-track {
                width: 100%;          /* 桌面充满容器 */
                overflow-x: hidden;   /* 超出部分隐藏 */
            }
            #ticker-inner {
                width: 100%;          /* inner 同样充满 track */
                flex-wrap: nowrap;
                overflow-x: hidden;
            }
            #ticker-inner-clone { display: none; }
        }
        </style>

        <div class="tabs">
            <button class="tab active">基金自选</button>
            <button class="tab">基金投资</button>
            <button class="tab">博主追踪</button>
        </div>

        <div class="search-container">
            <form id="add-fund-form">
                <input type="text" id="fund-code" class="search-input" placeholder="输入基金代码" required autocomplete="off">
                <button type="submit" class="add-button">+ Add</button>
            </form>
        </div>

        <div id="fund-list-header" style="display:flex;align-items:center;padding:8px 24px 6px;margin-bottom:2px;">
            <span style="font-size:13px;color:#888;letter-spacing:.5px;">Group Count</span>
            <span id="group-count" class="group-count" style="margin-left:8px;">0</span>
        </div>

        <div class="fund-list">
            <div id="funds-container"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/blogger-tracker.js') }}"></script>
</body>
</html>
