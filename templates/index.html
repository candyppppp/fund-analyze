<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FundTracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span class="fund-part">Fund</span><span class="tracker-part">Tracker</span></h1>
            <div class="header-buttons">
                <button>设置</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active">基金自选</button>
            <button class="tab">基金投资</button>
        </div>

        <div class="search-container">
            <form id="add-fund-form">
                <input type="text" id="fund-code" class="search-input" placeholder="输入基金代码" required autocomplete="off">
                <button type="submit" class="add-button">+ Add</button>
            </form>
        </div>

        <div id="fund-list-header" style="display:flex;align-items:center;justify-content:space-between;padding:8px 24px 6px;margin-bottom:2px;">
            <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:13px;color:#888;letter-spacing:.5px;">Group Count</span>
                <span id="group-count" class="group-count">0</span>
            </div>
            <div id="sort-controls" style="display:flex;gap:6px;">
                <button id="sort-holding" class="sort-btn sort-active" data-sort="holding">持仓优先</button>
                <button id="sort-return" class="sort-btn" data-sort="return">收益排序</button>
            </div>
        </div>

        <div class="fund-list">
            <div id="funds-container"></div>
        </div>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
