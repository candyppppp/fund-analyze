<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FundTracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span class="fund-part">Fund</span><span class="tracker-part">Tracker</span></h1>
            <div class="header-buttons">
                <button>设置</button>
            </div>
        </div>

        <!-- 大盘指数条 -->
        <div id="market-ticker">
            <!-- 桌面：静态展示；手机：跑马灯容器 -->
            <div id="ticker-scroll-wrap">
                <div id="ticker-inner">
                    <span class="ticker-loading">加载中...</span>
                </div>
                <!-- 手机跑马灯时复制一份，实现无缝循环 -->
                <div id="ticker-inner-clone" aria-hidden="true"></div>
            </div>

        </div>
        <style>
        /* ── Ticker 基础 ── */
        #market-ticker {
            background: #0d0d0d;
            border-bottom: 1px solid #1a1a1a;
            padding: 0;
            display: flex;
            align-items: center;
            height: 42px;
            overflow: hidden;
            flex-shrink: 0;
        }
        #ticker-scroll-wrap {
            flex: 1;
            display: flex;
            align-items: stretch;
            overflow: hidden;
            height: 100%;
            min-width: 0;
        }
        #ticker-inner, #ticker-inner-clone {
            display: flex;
            align-items: center;
            height: 100%;
            flex-shrink: 0;
        }
        #ticker-inner-clone { display: none; }   /* 桌面隐藏克隆 */
        .ticker-loading { font-size:12px; color:#444; padding-left:20px; }

        .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            padding: 0 20px;
            height: 100%;
            border-right: 1px solid #1a1a1a;
            box-sizing: border-box;
        }
        .ticker-item:last-child { border-right: none; }
        .ticker-name  { font-size: 13px; color: #aaa; font-weight: 400; }
        .ticker-price { font-size: 14px; font-weight: 500; color: #e8e8e8;
                        letter-spacing: .3px; font-variant-numeric: tabular-nums; }
        .ticker-chg   { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
        .tc-up   { color: #e84040; }
        .tc-down { color: #28a745; }
        .tc-flat { color: #666; }


        /* ── 手机端：跑马灯 ── */
        @media (max-width: 600px) {
            #market-ticker { padding: 0 8px 0 0; }
            #ticker-scroll-wrap {
                /* 手机上让内容无缝循环滚动 */
                overflow: visible;
                position: relative;
            }
            #ticker-inner-clone { display: flex; }  /* 显示克隆 */
            #ticker-inner, #ticker-inner-clone {
                animation: ticker-scroll 22s linear infinite;
            }
            #ticker-inner-clone {
                animation-delay: -11s;  /* 错开一半，实现无缝 */
            }
        }

        @keyframes ticker-scroll {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        </style>

        <div class="tabs">
            <button class="tab active">基金自选</button>
            <button class="tab">基金投资</button>
        </div>

        <div class="search-container">
            <form id="add-fund-form">
                <input type="text" id="fund-code" class="search-input" placeholder="输入基金代码" required autocomplete="off">
                <button type="submit" class="add-button">+ Add</button>
            </form>
        </div>

        <div id="fund-list-header" style="display:flex;align-items:center;padding:8px 24px 6px;margin-bottom:2px;">
            <span style="font-size:13px;color:#888;letter-spacing:.5px;">Group Count</span>
            <span id="group-count" class="group-count" style="margin-left:8px;">0</span>
        </div>

        <div class="fund-list">
            <div id="funds-container"></div>
        </div>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
